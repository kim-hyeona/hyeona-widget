name: Android today-only fix
on:
  push:
    branches: [fix/today-only-20261125]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: hyeona-debug-keystore-v1
      - name: Preserve installed app signing identity
        run: |
          test -f ~/.android/debug.keystore
          actual=$(keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          test "$actual" = "6f98fefc0d884d22ed7498f2c4eecd8c2b5bf87e054c80e8cd19ed9c273a0442"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :android:assembleDebug :android:testDebugUnitTest :android:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hyeona-Widget-1.6.6-date-fix
          path: |
            android/build/outputs/apk/debug/android-debug.apk
            android/build/test-results/testDebugUnitTest/TEST-*.xml
