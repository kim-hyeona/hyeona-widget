name: Android today-only fix
on:
  push:
    branches: [fix/today-only-20261125]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :android:assembleRelease :android:testDebugUnitTest :android:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hyeona-Widget-1.6.6-date-fix-unsigned
          path: |
            android/build/outputs/apk/release/*-unsigned.apk
            android/build/test-results/testDebugUnitTest/TEST-*.xml
