name: Android today-only fix
on:
  push:
    branches: [fix/today-only-20261125]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Cache Android test framework
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7
          key: hyeona-test-api35-13954326-i7
      - name: Fetch and verify Android test framework
        run: |
          target="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7"
          mkdir -p "$target"
          file="android-all-instrumented-15-robolectric-13954326-i7.jar"
          for suffix in "$file" "$file.sha512"; do
            if [ ! -s "$target/$suffix" ]; then
              curl -fL --retry 5 --retry-all-errors --retry-delay 3 "https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/$suffix" -o "$target/$suffix" || curl -fL --retry 5 --retry-all-errors --retry-delay 3 "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/$suffix" -o "$target/$suffix"
            fi
          done
          digest=$(cat "$target/$file.sha512")
          echo "$digest  $target/$file" | sha512sum --check -
      - run: gradle :android:assembleRelease :android:testDebugUnitTest :android:lintDebug -ProbolectricOfflineDir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hyeona-Widget-1.6.6-date-fix-unsigned
          path: |
            android/build/outputs/apk/release/*-unsigned.apk
            android/build/test-results/testDebugUnitTest/TEST-*.xml
