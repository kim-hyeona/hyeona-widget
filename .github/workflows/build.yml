name: Build install files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hyeona-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: Hyeona-Widget-Android-APK, path: android/build/outputs/apk/debug/android-debug.apk}
  windows:
    runs-on: windows-latest
    defaults:
      run: {working-directory: windows}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: windows/package.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: Hyeona-Widget-Windows-Installer, path: windows/dist/*.exe}


  render:
    uses: ./.github/workflows/widget-validation.yml

  publish:
    needs: [android, windows, render]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {path: installers}
      - name: Publish Android 1.6.3 installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp installers/Hyeona-Widget-Android-APK/android-debug.apk installers/Hyeona-Widget-1.6.3.apk
          gh release view v1.6.3-build31 || gh release create v1.6.3-build31 --target "$GITHUB_SHA" --title "1.6.3 build 31" --notes "Android: per-event colors, 5x6 layout, larger memo/routine panels, ongoing routine notification. Windows unchanged."
          gh release upload v1.6.3-build31 installers/Hyeona-Widget-1.6.3.apk --clobber


