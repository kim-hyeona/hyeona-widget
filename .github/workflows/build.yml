name: Build install files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hyeona-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: Hyeona-Widget-Android-APK, path: android/build/outputs/apk/debug/android-debug.apk}
  windows:
    runs-on: windows-latest
    defaults:
      run: {working-directory: windows}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: windows/package.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: Hyeona-Widget-Windows-Installer, path: windows/dist/*.exe}


  render:
    uses: ./.github/workflows/widget-validation.yml

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: Hyeona-Widget-Windows-Installer, path: installers}
      - name: Publish Windows 1.6.7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view windows-v1.6.7 || gh release create windows-v1.6.7 --target "$GITHUB_SHA" --title "Windows 1.6.7" --notes "Fix Windows Today to read and write the shared Notion task database used by Android. Preserve undated tasks and keep calendar events separate."
          gh release upload windows-v1.6.7 installers/*.exe --clobber
