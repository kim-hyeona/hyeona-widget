name: Build install files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: Hyeona-Widget-Android-APK, path: android/build/outputs/apk/debug/android-debug.apk}
  windows:
    runs-on: windows-latest
    defaults:
      run: {working-directory: windows}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: windows/package.json}
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: Hyeona-Widget-Windows-Installer, path: windows/dist/*.exe}

