name: Validate credential storage
on:
  pull_request:
    paths:
      - 'windows/**'
      - 'android/**'
      - '.github/workflows/credential-security.yml'
permissions:
  contents: read
jobs:
  windows-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test windows/main.test.cjs windows/secure-settings.test.cjs
  android-storage:
    uses: ./.github/workflows/widget-validation.yml
