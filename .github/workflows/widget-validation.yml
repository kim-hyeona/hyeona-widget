name: Validate Android widget rendering
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :android:assembleDebug :android:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/build/outputs/apk/debug/android-debug.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            adb shell am instrument -w com.hyeona.widget.test/com.hyeona.widget.WidgetRenderInstrumentation > widget-render-result.txt
            cat widget-render-result.txt
            grep -q WIDGET_RENDER_OK widget-render-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: widget-render-result, path: widget-render-result.txt}
