plugins { id "com.android.application" }

android {
    namespace "com.hyeona.widget"
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        testInstrumentationRunner "com.hyeona.widget.WidgetRenderInstrumentation"
        applicationId "com.hyeona.widget.dates"
        minSdk 26
        targetSdk 35
        versionCode 34
        versionName "1.6.6"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {unitTests.includeAndroidResources=true;unitTests.all {maxHeapSize="1024m";if(project.hasProperty("robolectricOfflineDir")){systemProperty "robolectric.offline","true";systemProperty "robolectric.dependency.dir",project.property("robolectricOfflineDir")};systemProperty "robolectric.dependency.repo.url","https://repo.maven.apache.org/maven2";["https.proxyHost","https.proxyPort","http.proxyHost","http.proxyPort","javax.net.ssl.trustStore"].each {n->if(System.getProperty(n))systemProperty n,System.getProperty(n)}}}
}




dependencies {testImplementation "junit:junit:4.13.2";testImplementation "org.json:json:20240303";testImplementation "org.robolectric:robolectric:4.16.1"}
