<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현아 위젯</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#284348;font-family:"Malgun Gothic",sans-serif;background:linear-gradient(135deg,#dceff2,#edf6f2 52%,#dbeaf2);padding:28px}.shell{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.brand{font:700 30px Georgia,serif}.date{color:#66868b}.grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:16px}.card{background:#ffffffb8;border:1px solid #ffffffd9;border-radius:24px;padding:22px;box-shadow:0 18px 50px #52757c1a;backdrop-filter:blur(16px)}.todo{grid-row:span 2}.card h2{font:700 20px Georgia,serif;margin:0 0 17px}.add{display:flex;gap:8px}input,button{border:1px solid #bed3d5;border-radius:13px;padding:11px;background:#ffffffbf;color:#284348}input{width:100%}button{cursor:pointer;background:#7eaeb2;color:white;border:0;font-weight:700}.tasks{margin-top:14px;display:grid;gap:9px}.task{display:flex;align-items:center;gap:11px;padding:11px 12px;background:#eef7f6;border-radius:14px}.check{width:24px;height:24px;border:1px solid #82afb2;border-radius:50%;background:white;color:#608f92;padding:0;flex:none}.done .name{text-decoration:line-through;opacity:.5}.name{flex:1}.small{font-size:12px;color:#779398}.note{min-height:120px;line-height:1.7;color:#678489}.bubble{height:150px;border-radius:20px;background:radial-gradient(circle at 28% 23%,#fff 0 3%,transparent 4%),linear-gradient(160deg,#8ec6d1,#d9ece5 55%,#7da7b8);display:grid;place-items:center;color:#fff;font:italic 22px Georgia,serif;text-shadow:0 2px 10px #31565e66}.settings{margin-top:16px;display:flex;gap:8px}.status{margin-top:10px;font-size:13px;color:#628086}.empty{padding:34px;text-align:center;color:#78969a}@media(max-width:880px){.grid{grid-template-columns:1fr}.todo{grid-row:auto}.top{align-items:start;flex-direction:column;gap:5px}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">hyeona's gentle dashboard 𓇼</div><div class="date" id="date"></div></div><div class="small">우클릭 → 항상 위에 고정</div></header><section class="grid"><article class="card todo"><h2>today's to-do ♡</h2><div class="add"><input id="newTask" placeholder="오늘 할 일 적기"><button id="add">추가</button></div><div class="tasks" id="tasks"><div class="empty">아래에 Notion 연결키를 저장해 주세요.</div></div></article><article class="card"><h2>wishlist</h2><div class="note">갖고 싶은 것과 가고 싶은 곳을<br>노션에 차곡차곡 모아두는 자리 ♡</div></article><article class="card"><h2>sea of the day</h2><div class="bubble">soft waves, slow days</div></article><article class="card"><h2>memo</h2><div class="note">오늘 떠오른 생각을 잠시 머물게 해요.<br><br>위시리스트와 메모 연동도 다음 버전에서 붙일 수 있어요.</div></article><article class="card"><h2>Notion 연결</h2><div class="small">ChatGPT 로그인은 필요 없어요. 내부 통합 시크릿은 이 PC에만 저장됩니다.</div><div class="settings"><input id="token" type="password" placeholder="secret_... 또는 ntn_..."><button id="save">저장</button></div><div class="status" id="status"></div></article></section></main>
<script>
const $=s=>document.querySelector(s),token=$('#token'),tasks=$('#tasks'),status=$('#status');$('#date').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());token.value=localStorage.notionToken||'';const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const key=token.value.trim();if(!key)return;status.textContent='불러오는 중…';try{const list=await window.hyeona.list(key);tasks.innerHTML=list.length?list.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-id="${t.id}" data-done="${t.done}">${t.done?'✓':'○'}</button><span class="name">${esc(t.title)}</span><span class="small">${t.date||''}</span></div>`).join(''):'<div class="empty">할 일이 없어요 ♡</div>';status.textContent='Notion과 연결됐어요 ♡';document.querySelectorAll('.check').forEach(b=>b.onclick=async()=>{await window.hyeona.toggle(key,b.dataset.id,b.dataset.done!=='true');load()})}catch(e){status.textContent=e.message||'연결을 확인해 주세요.'}}
$('#save').onclick=()=>{localStorage.notionToken=token.value.trim();load()};$('#add').onclick=async()=>{const v=$('#newTask').value.trim();if(!v||!token.value.trim())return;await window.hyeona.add(token.value.trim(),v);$('#newTask').value='';load()};$('#newTask').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};if(token.value)load();
</script></body></html>
